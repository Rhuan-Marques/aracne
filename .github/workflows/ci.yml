name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # CGO is mandatory: the JS/TS, Rust and Java scanners are tree-sitter. Linux and
      # macOS runners already ship a C compiler; Windows needs mingw-w64 on PATH, which
      # the runner image provides at C:\mingw64\bin.
      - name: Set up C toolchain (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "C:\mingw64\bin" >> "$GITHUB_PATH"

      - name: Verify module checksums
        run: go mod verify

      - name: Build (Full)
        run: go build ./...

      - name: Build (Basic)
        run: go build -tags minimal ./cmd/arac

      - name: Vet
        run: |
          go vet ./...
          go vet -tags minimal ./...

      # -timeout is spelled out because the default is 10 MINUTES PER PACKAGE, and on
      # Windows one package already spends most of it. Same commit, run #38: this suite
      # is 93s on Linux and 91s on macOS, and 570s here, with internal/topology alone at
      # 443s against 67s on Linux. That is a 6.6x platform tax, not a slow test -- and it
      # leaves ~2.5 minutes of margin. A runner that comes up slower than usual eats it:
      # run #39 took ~3x its usual wall time on every package in the suite, internal/
      # topology crossed 600s, and the binary died with a panic naming whichever test was
      # running at the 10-minute mark rather than anything that was actually wrong.
      #
      # Windows alone gets the longer budget. Linux and macOS keep the 10m default, where
      # a 90-second suite has nothing to gain from a higher ceiling and a genuine hang
      # should still fail fast.
      - name: Test
        run: go test -timeout ${{ runner.os == 'Windows' && '40m' || '10m' }} ./...

      # The Basic build is a shipped artifact, so it needs its own run: a default
      # `go test ./...` never compiles under this tag set.
      - name: Test (Basic)
        run: go test -tags minimal -timeout ${{ runner.os == 'Windows' && '40m' || '10m' }} ./...
    env:
      CGO_ENABLED: '1'

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      # The action's major must match the golangci-lint major: v6 installs the v1 line,
      # which cannot read this repo's `version: "2"` config. The version is pinned rather
      # than `latest` for the same reason CI pins everything else -- and because the
      # binary has to be BUILT with a Go at least as new as go.mod's (`go 1.25.0`), or the
      # config loader refuses to start. v2.13.2 is built with go1.26.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # testing_ground/ is excluded on purpose: it is a deliberately malformed corpus and
      # reformatting it shifts line numbers the at-scale suites assert on.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./tests)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
