[pytest]
# norecursedirs keeps collection out of the checked-out third-party repos under fixtures/,
# which contain their own test suites and their own conftest.py files.
#
# HISTORY: this file used to force `--assert=plain`, because a benchmark run had installed
# the pytest *fixture* (pytest 4.6, from bench/fixtures/pytest-dev__pytest@...) into user
# site-packages, and that version's assertion rewriter cannot parse Python 3.12 ASTs. The
# cause is documented in claude_driver.py: agents solving SWE-bench tasks run
# `pip install -e .` and, unsandboxed, that lands in the host's site-packages. The driver
# now redirects PYTHONUSERBASE per run so it cannot happen again.
#
# Run with a venv'd pytest, e.g. ~/.venvs/bench/bin/pytest
norecursedirs = fixtures results samples __pycache__ .git
testpaths = .
