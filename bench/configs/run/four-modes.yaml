samples: 8
oversample: 4
max_per_repo: 1
sample_seed: 0
max_describable_nodes: 8000

seeds: 1
arms: [baseline, mcp, aracne-read, intercept-id, line-range]

run_harness: claude_code
model: opus
effort: medium
max_turns: 80
timeout_s: 2400
run_parallel: 3

grade_timeout_s: 7200
grade_stall_timeout_s: 1800
ni_margin: 0.10

isolate_operator_config: true
deny_answer_key: true

arm_builtin_tools:
  baseline:     [Bash, Glob]
  mcp:          [Bash, Glob]
  aracne-read:  [Bash, Glob]
  intercept-id: [Bash, Glob]
  line-range:   [Bash, Glob]

arm_aracne_config:
  mcp:          mcp
  aracne-read:  aracne-read
  intercept-id: intercept-id
  line-range:   line-range
