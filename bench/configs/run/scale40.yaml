# The sizing study: 40 tasks, ONE PER REPOSITORY, across all five languages.
#
# Why this shape. The paired analysis clusters on repository, so effective N is the REPO
# count — the previous `multi` manifest held 10 tasks over only 6 repos, which is why its
# context-token interval spanned [-24%, +15%] and settled nothing. Eight distinct repos per
# language gives an effective N of ~40, enough to put a ~±6-8% interval on the paired
# context-token ratio.
#
# max_describable_nodes is deliberately HIGH. The old 600-node cap dropped exactly the large
# repositories where topology navigation should beat grepping, biasing the study AGAINST
# aracne and making the pool unrepresentative. Keeping big repos in is what makes the
# size-stratified breakdown (small / medium / large + slope) possible at all.
#
# Run the phases in order, all with `--config scale40`:
#   python bench/run_benchmark.py sample   --config scale40
#   python bench/run_benchmark.py prepare  --config scale40
#   python bench/run_benchmark.py generate --config scale40
#   python bench/run_benchmark.py freeze   --config scale40
#   python bench/run_benchmark.py run      --config scale40
#
# COST: generation is the expensive phase (it describes every repo once) and it scales with
# repo size, so with a raised node cap expect it to dominate. It is resumable — run it
# across several sessions with the same sample_id rather than in one window.

sample_id: scale40
languages: [go, javascript, typescript, rust, python]

samples: 8              # FINAL tasks per language -> 40 total, and (at max_per_repo 1) 40 repos
oversample: 4           # 32 candidates/lang so `prepare` has room to drop unusable repos
max_per_repo: 1         # ONE task per repository: every task is an independent cluster
sample_seed: 0

max_describable_nodes: 8000   # keep large repos IN (was 600 — see above)

seeds: 1                # seeds do NOT raise effective N; spend budget on repos instead
arms: [baseline, aracne]
run_harness: claude_code
model: haiku            # the efficiency endpoint is the primary claim and is cheap to measure
max_turns: 80
timeout_s: 2400
run_parallel: 1         # raise (2-4) to cut wall-clock of a 54-cell matrix; see README "Parallelism"

# Grading caps sized for cold Docker builds on large JS/TS repos. The earlier 60s stall cap
# killed every vuejs/core grade mid-build and censored 30% of the matrix.
grade_timeout_s: 7200
grade_stall_timeout_s: 1800

ni_margin: 0.10         # correctness guardrail beside the efficiency claim
