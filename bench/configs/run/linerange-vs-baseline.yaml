# The measurement that actually tests aracne: line-range identification against a control with
# the SAME tool surface.
#
# WHY THIS CONFIG EXISTS. Every prior comparison was decided by the arms' tool lists rather
# than by aracne:
#
#   batched-20260901a   -45.0% "significant" -- aracne ran `--tools Bash` (5,427 prefix tokens)
#                       against an imported control carrying all 27 built-ins (16,851). The
#                       11,424 tok/turn gap explains 79% of the measured ctx/turn difference.
#   ab-prefer-ids-...a  -21% -- a smaller repeat of the same error: the control kept Read, Edit,
#                       Write and Grep (2,468 tok/turn) and called them ZERO times in 462 Bash
#                       calls. Corrected to an equal surface, aracne was 0.961x: break-even.
#
# So both arms here get exactly [Bash, Glob], which is what the control demonstrably uses and
# nothing more, and the control is RE-MEASURED. No `baseline_from`: a control measured under a
# different prefix is the precise mistake above, and importing one would repeat it a third time.
#
# WHAT IS UNDER TEST. `identification_mode: line_range` -- every surface that used to name a
# resource by topology ID now names it by `path:start-end`. Measured over
# ab-prefer-ids-20260902a the model used a resource ID as a command operand 0 times in 408
# commands while addressing code as file+line in all 408, so this speaks the model's own
# vocabulary instead of asking it to learn ours. Reading an advertised span returns exactly what
# the resource read would have -- verified byte-identical.
#
# Two arms only. The A/B between contract variants is settled (null, and its manipulation check
# failed at zero); what is unsettled is whether aracne beats a fairly-configured control at all.

sample_id: scale40
languages: [go, javascript, typescript, rust, python]

samples: 8
oversample: 4
max_per_repo: 1
sample_seed: 0
max_describable_nodes: 8000

seeds: 1
arms: [baseline, aracne]

run_harness: claude_code
model: opus
effort: medium
max_turns: 80
timeout_s: 2400
run_parallel: 3

grade_timeout_s: 7200
grade_stall_timeout_s: 1800
ni_margin: 0.10

isolate_operator_config: true
deny_answer_key: true

# IDENTICAL SURFACES. `TodoWrite` does not exist in Claude Code 2.1.258 -- naming it is a silent
# no-op, which is why earlier runs asked for three tools and were offered two.
arm_builtin_tools:
  baseline: [Bash, Glob]
  aracne:   [Bash, Glob]

arm_aracne_config:
  aracne: line-range
