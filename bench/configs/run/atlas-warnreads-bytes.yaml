# Token-economy probe for features.warning_reads with the 10 KB byte budget. No grading, no analysis.
# BOTH arms measured in the same run (same Claude Code, same day) -- no imported baseline.
# Sample: the 5 atlas12 tasks whose aracne arm fired topology warnings in atlas12-read-1.
sample_id: atlas-warnreads5
languages: [go]

seeds: 1
arms: [baseline, aracne]

run_harness: claude_code
model: opus
effort: medium
max_turns: 100
timeout_s: 3600
run_parallel: 3

isolate_operator_config: true
deny_answer_key: true
allow_cold: true

arm_builtin_tools:
  baseline: [Bash, Glob]
  aracne:   [Bash, Glob]

arm_aracne_config:
  aracne: lazy-aracneread-warnreads
