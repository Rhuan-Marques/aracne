sample_id: scale40
languages: [go, javascript, typescript, rust, python]

samples: 8
oversample: 4
max_per_repo: 1
sample_seed: 0

max_describable_nodes: 8000

seeds: 1
arms: [baseline, aracne, aracne-open]

arm_aracne_config:
  aracne: perf-balanced
  aracne-open: perf-open

run_harness: claude_code
model: opus
max_turns: 80
timeout_s: 2400

run_parallel: 1

grade_timeout_s: 7200
grade_stall_timeout_s: 1800

ni_margin: 0.10

isolate_operator_config: true

allowed_tools:
  - Bash
  - Task
  - TodoWrite
  - mcp__aracne__read
  - mcp__aracne__grep
  - mcp__aracne__edit
  - mcp__aracne__write
  - mcp__aracne__warnings_list
