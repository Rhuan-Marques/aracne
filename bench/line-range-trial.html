<style>

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);margin:0;font-family:"Public Sans",system-ui,sans-serif;

.wrap{max-width:1050px;margin:0 auto;padding:44px 26px 90px;display:flex;flex-direction:column;gap:40px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:53px;line-height:1.03;letter-spacing:-.012em}

h3{font-size:15px;font-weight:600}
p{margin:0}

.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:13px;border-bottom:1px solid var(--rule);padding-bottom:26px}
.chips{display:flex;flex-wrap:wrap;gap:7px}

.figs{display:flex;flex-wrap:wrap;gap:22px 42px;margin-top:4px}
.fig{display:flex;flex-direction:column;gap:2px}
.fig .v{font-family:"IBM Plex Mono",monospace;font-size:25px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.fig .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
.tag.ns{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.tag.no{background:var(--bad-soft);color:var(--bad)}
section{display:flex;flex-direction:column;gap:17px}
.head{display:flex;flex-direction:column;gap:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:right;padding:9px 15px;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;background:var(--sunk);border-bottom:1px solid var(--rule-2)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--sunk)}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
td.win{color:var(--good);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.card{border:1px solid var(--rule);background:var(--panel);padding:18px 20px;display:flex;flex-direction:column;gap:7px}
.card.pos{border-top:3px solid var(--good)} .card.neg{border-top:3px solid var(--bad)}
.card .n{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:500}
.card p{font-size:13.5px;color:var(--ink-2)}
.note{border-left:3px solid var(--rule-2);padding:3px 0 3px 16px;color:var(--ink-2);display:flex;
  flex-direction:column;gap:9px;max-width:72ch;font-size:14px}
.note.warn{border-left-color:var(--warn)} .note.good{border-left-color:var(--good)}
.note strong{color:var(--ink)}
.chart{border:1px solid var(--rule);background:var(--panel);padding:22px 24px 14px;display:flex;flex-direction:column;gap:12px}
svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
ol.plan{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:15px;counter-reset:p}
ol.plan li{counter-increment:p;border:1px solid var(--rule);background:var(--panel);padding:18px 20px 18px 56px;
  position:relative;display:flex;flex-direction:column;gap:7px}
ol.plan li::before{content:counter(p);position:absolute;left:20px;top:17px;font-family:"IBM Plex Mono",monospace;
  font-size:13px;font-weight:600;color:var(--accent)}
ol.plan .why{font-size:13.5px;color:var(--ink-2)}
ol.plan .ev{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
code{font-family:"IBM Plex Mono",monospace;font-size:.9em;background:var(--sunk);border:1px solid var(--rule);
  border-radius:3px;padding:1px 5px}
footer{border-top:1px solid var(--rule);padding-top:20px;color:var(--ink-3);font-size:12.5px;display:flex;flex-direction:column;gap:5px}
@media (max-width:640px){h1{font-size:37px}.verdict h2{font-size:25px}.wrap{padding:30px 17px 60px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  body = `Aracne solved ${D.solved.aracne}/${D.graded.aracne} against the control's ${D.solved.baseline}/${D.graded.baseline}, all five discordant pairs its way. Case-by-case review finds one contaminated (an upstream package diff) and one a turn-cap artifact, leaving 3&ndash;0 with no visible mechanism &mdash; p=0.25. Cost was ${x(ctxm.ratio)} context tokens (${pc(ctxm.pct)}), and 1.28&times; on the tasks both arms solved.`;
  const _unusedHead = sig ? (cheaper? 'Aracne is measurably cheaper than plain Claude Code.'
                       : 'Aracne is measurably more expensive than plain Claude Code.')
             : (cheaper? 'Aracne is directionally cheaper, but the interval spans 1.00.'
                       : 'Aracne is directionally more expensive, and the interval spans 1.00.');
  body = `Context tokens came in at <strong>${x(r)}</strong> (${pc(ctxm.pct)}), 95% CI
    ${ctxm.ci?ctxm.ci[0].toFixed(2)+'–'+ctxm.ci[1].toFixed(2):'—'}, over ${P.clusters} repositories.
    Correctness: ${D.solved.aracne}/${D.graded.aracne} solved against the control's
    ${D.solved.baseline}/${D.graded.baseline}.`;

</tbody></table></div></section>`);

/* per-task chart */
const T=D.tasks.map(t=>({...t,r:t.baseline.ctx>0?t.aracne.ctx/t.baseline.ctx:null}))
  .filter(t=>t.r>0&&isFinite(t.r)).sort((a,b)=>a.r-b.r);
if(T.length){
  const W=920,rh=18,pl=225,pr=58,pt=36,pb=44,Hh=pt+T.length*rh+pb;
  const ls=T.map(t=>Math.log(t.r)).filter(isFinite);
  const sp=Math.max(.4,ls.length?Math.max(...ls.map(Math.abs))*1.15:1);
  const X=v=>pl+((Math.log(v)+sp)/(2*sp))*(W-pl-pr);
  const tk=[0.25,0.5,1,2,4].filter(v=>Math.abs(Math.log(v))<=sp);
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Per-repository context tokens, aracne relative to baseline">`;
  tk.forEach(v=>{const one=Math.abs(v-1)<1e-9;
    s+=`<line x1="${X(v).toFixed(1)}" y1="${pt-8}" x2="${X(v).toFixed(1)}" y2="${Hh-pb+6}" stroke="${one?'var(--ink-3)':'var(--grid)'}" stroke-width="${one?1.4:1}" ${one?'':'stroke-dasharray="2 4"'}/>`;
    s+=`<text x="${X(v).toFixed(1)}" y="${Hh-pb+22}" text-anchor="middle" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace" font-size="11">${v}×</text>`;});
  s+=`<text x="${pl}" y="${pt-16}" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="1">← ARACNE CHEAPER</text>`;
  s+=`<text x="${W-pr}" y="${pt-16}" text-anchor="end" fill="var(--ink-3)" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="1">BASELINE CHEAPER →</text>`;
  T.forEach((t,i)=>{const y=pt+i*rh+rh/2;const col=!t.aracne.ok?'var(--warn)':(t.r<1?'var(--good)':'var(--bad)');
    s+=`<line x1="${X(1).toFixed(1)}" y1="${y}" x2="${X(t.r).toFixed(1)}" y2="${y}" stroke="${col}" stroke-width="1.4" opacity=".4"/>`;
    s+=`<circle cx="${X(t.r).toFixed(1)}" cy="${y}" r="3.7" fill="${col}"/>`;
    s+=`<text x="${pl-12}" y="${y+3.6}" text-anchor="end" fill="var(--ink-2)" font-family="IBM Plex Mono, monospace" font-size="10.5">${H((t.repo||t.id).slice(0,32))}</text>`;});
  s+=`</svg>`;
  const w=T.filter(t=>t.r<1).length, f=T.filter(t=>!t.aracne.ok).length;
  app.insertAdjacentHTML('beforeend',`
  <section><div class="head"><h2>Every repository</h2>
  <p class="sub">Aracne's context tokens relative to the same task on baseline. Log scale.</p></div>
  <div class="chart">${s}<div class="legend">
    <span><span class="sw" style="background:var(--good)"></span>aracne cheaper — ${w}/${T.length}</span>
    <span><span class="sw" style="background:var(--bad)"></span>baseline cheaper — ${T.length-w-f}</span>
    <span><span class="sw" style="background:var(--warn)"></span>aracne did not solve — ${f}</span>
  </div></div></section>`);
}

/* behaviour: did line ranges change what the model read? */
const AL=D.alignment||{};
if(AL.aracne&&AL.baseline){
  const row=a=>{const v=AL[a];return `<tr><td>${H(L[a])}</td><td class="num">${v.ranged}</td>
    ${[0,2,5].map(t=>`<td class="num">${v['t'+t]} (${v.ranged?Math.round(v['t'+t]/v.ranged*100):0}%)</td>`).join('')}</tr>`;};
  app.insertAdjacentHTML('beforeend',`
  <section><div class="head"><h2>Did the ranges change behaviour?</h2>
  <p class="sub">Every context entry and grep header now advertises a declaration's exact span. If
  the model acts on them, its reads should land on declaration boundaries more than the control's do.</p></div>
  <div class="tablewrap"><table>
  <thead><tr><th>Arm</th><th>Ranged reads</th><th>Exact span</th><th>Within ±2 lines</th><th>Within ±5 lines</th></tr></thead>
  <tbody>${row('baseline')}${row('aracne')}</tbody></table></div>
  <div class="note warn"><p><strong>This is the manipulation check, and it is the number to read
  first.</strong> If the two arms land on declaration boundaries at the same rate, the annotation was
  delivered and ignored — exactly as resource IDs were (0 adoptions in 408 commands) — and any cost
  difference has some other cause.</p>
  <p>One limit: transcripts are size-reduced, so the ranges aracne actually printed are not
  recoverable. Landing on a declaration span is a proxy for acting on an advertised one, not proof.</p></div>
  </section>`);
}
